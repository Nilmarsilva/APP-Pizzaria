<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13b6ec",
                        "background-light": "#f9fafa",
                        "background-dark": "#1a1c22",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: "Plus Jakarta Sans", sans-serif;
        }
        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display">
<!-- Top Navigation Bar -->
<header class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 ios-blur px-4 py-3 flex items-center justify-between">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-white dark:bg-gray-800 shadow-sm text-gray-900 dark:text-white">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h1 class="text-[#111618] dark:text-white text-lg font-bold">Registro</h1>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<main class="flex-1 px-6 pb-12 pt-4 max-w-md mx-auto w-full">
<!-- Hero Section / Branding -->
<div class="flex flex-col items-center mb-8">
<div class="w-20 h-20 mb-6 rounded-2xl bg-primary flex items-center justify-center shadow-lg shadow-primary/30">
<span class="material-symbols-outlined text-white text-4xl">local_pizza</span>
</div>
<h2 class="text-[#111618] dark:text-white text-3xl font-bold text-center tracking-tight">Criar Conta</h2>
<p class="text-gray-500 dark:text-gray-400 text-center mt-2 text-base">Rápido, fácil e cheio de sabor.</p>
</div>
<!-- Registration Form -->
<div class="space-y-4">
<!-- Full Name -->
<div class="flex flex-col gap-1.5">
<label class="text-[#111618] dark:text-gray-200 text-sm font-semibold ml-1">Nome Completo</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xl">person</span>
<input class="w-full pl-12 pr-4 h-14 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all dark:text-white placeholder:text-gray-400" placeholder="Digite seu nome" type="text"/>
</div>
</div>
<!-- WhatsApp -->
<div class="flex flex-col gap-1.5">
<label class="text-[#111618] dark:text-gray-200 text-sm font-semibold ml-1">WhatsApp</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xl">chat</span>
<input class="w-full pl-12 pr-4 h-14 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all dark:text-white placeholder:text-gray-400" placeholder="(00) 00000-0000" type="tel"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-1.5">
<label class="text-[#111618] dark:text-gray-200 text-sm font-semibold ml-1">E-mail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xl">mail</span>
<input class="w-full pl-12 pr-4 h-14 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all dark:text-white placeholder:text-gray-400" placeholder="exemplo@email.com" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-1.5">
<label class="text-[#111618] dark:text-gray-200 text-sm font-semibold ml-1">Senha</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xl">lock</span>
<input class="w-full pl-12 pr-12 h-14 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all dark:text-white placeholder:text-gray-400" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-8 h-14 bg-primary hover:bg-primary/90 text-white font-bold text-lg rounded-xl shadow-lg shadow-primary/20 flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
            Criar Minha Conta
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
<!-- Divider -->
<div class="flex items-center my-10">
<div class="flex-1 h-px bg-gray-200 dark:bg-gray-700"></div>
<span class="px-4 text-gray-400 text-sm font-medium uppercase tracking-wider">ou entre com</span>
<div class="flex-1 h-px bg-gray-200 dark:bg-gray-700"></div>
</div>
<!-- Social Login Grid -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 h-14 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl font-semibold dark:text-white hover:bg-gray-50 dark:hover:bg-gray-750 transition-colors shadow-sm">
<img alt="Google" class="w-5 h-5" data-alt="Google logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC0d7sj-KyYFVMz8mSYWUQWdAXg8o_9DFEolWjiehkdq4koi9oBe8lZUK39G4lHay6aQh7njO9RMRoM-Q8YxJV3ywhUXkPUUE7JzEFpPNXnV-eJ1oSNFhS4NbQcbUpZL2N6XjtF0v-fd9hkolf_4TA3YCU6Hk1hjimoRXWCN_AsqCilZ5N19DgYQV2sVzxKdHGumn91CkIyabWEwvti_ArFokt5K_iYEcMCsi-lPVswoxjvJzhfUAyIhdLDsLZimFkKTq78IUDQF3g"/>
                Google
            </button>
<button class="flex items-center justify-center gap-3 h-14 bg-[#1877F2] text-white rounded-xl font-semibold hover:bg-opacity-90 transition-colors shadow-sm">
<svg class="w-6 h-6 fill-current" viewbox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
                Facebook
            </button>
</div>
<!-- Terms and Login Redirect -->
<div class="mt-10 text-center space-y-4">
<p class="text-gray-500 text-sm px-4">
                Ao se registrar, você concorda com nossos 
                <a class="text-primary font-semibold" href="#">Termos de Uso</a> e 
                <a class="text-primary font-semibold" href="#">Privacidade</a>.
            </p>
<div class="h-px w-8 bg-gray-300 dark:bg-gray-600 mx-auto"></div>
<p class="text-gray-600 dark:text-gray-400 font-medium">
                Já tem uma conta? 
                <a class="text-primary font-bold ml-1" href="#">Entre aqui</a>
</p>
</div>
</main>
<!-- Subtle background decoration for "Distinctive" touch -->
<div class="fixed top-0 right-0 -z-10 opacity-10 dark:opacity-5 pointer-events-none translate-x-1/4 -translate-y-1/4">
<span class="material-symbols-outlined text-[300px] text-primary">local_pizza</span>
</div>
</body></html>
